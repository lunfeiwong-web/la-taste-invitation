<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>派对邀请函音乐试听 | La Taste 3悦</title>
  <style>
    :root {
      --green: #173f34;
      --gold: #c99a45;
      --cream: #fff8e8;
      --ink: #21352f;
      --muted: #6a756f;
      --pink: #f5aabc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(23, 63, 52, 0.95), rgba(23, 63, 52, 0.82)),
        #173f34;
      color: var(--ink);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(920px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    header {
      color: white;
      margin-bottom: 18px;
    }

    header span {
      color: #f5d996;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 8px;
      font-size: clamp(2rem, 8vw, 4rem);
      line-height: 1.05;
    }

    header p {
      max-width: 680px;
      margin: 0;
      color: rgba(255, 255, 255, 0.82);
      font-size: 1rem;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .track {
      display: grid;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 18px;
      padding: 18px;
      background: rgba(255, 248, 232, 0.96);
      box-shadow: 0 22px 52px rgba(0, 0, 0, 0.18);
    }

    .track h2 {
      margin: 0;
      color: var(--green);
      font-size: 1.25rem;
    }

    .track p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 800;
    }

    .play {
      background: var(--green);
      color: white;
    }

    .stop {
      background: rgba(23, 63, 52, 0.12);
      color: var(--green);
    }

    .choose {
      background: var(--gold);
      color: white;
    }

    #status {
      position: sticky;
      bottom: 0;
      margin-top: 16px;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 18px;
      padding: 14px 16px;
      background: rgba(255, 248, 232, 0.94);
      color: var(--green);
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <span>La Taste 3悦 Party Invitation</span>
      <h1>派对邀请函音乐试听</h1>
      <p>已选用真实歌曲版本，不再使用浏览器合成铃声。点击试听确认声音。</p>
    </header>

    <section class="grid" id="trackList"></section>
    <div id="status">点击任一首试听。手机可能需要先点一次播放才会出声。</div>
  </main>

  <script>
    const track = {
      id: "pixabay-birthday",
      name: "Happy Birthday - Birthday Music — PaulYudin",
      note: "Pixabay 音乐，1:26 MP3，适合生日和派对邀请函。你已经确认选用这首。",
      file: "audio/paulyudin-happy-birthday-birthday-music-595942.mp3?v=paulyudin-20260927",
      source: "https://pixabay.com/music/beats-happy-birthday-birthday-music-595942/"
    };

    const player = new Audio(track.file);
    player.loop = true;
    player.volume = 0.72;

    function stopAll() {
      player.pause();
      player.currentTime = 0;
    }

    function playTrack() {
      player.play().then(() => {
        document.getElementById("status").textContent = `正在试听：${track.name}`;
      }).catch(() => {
        document.getElementById("status").textContent = "手机或浏览器拦截了播放，请再点一次试听。";
      });
    }

    function chooseTrack() {
      document.getElementById("status").textContent = `已选：${track.name}`;
    }

    document.getElementById("trackList").innerHTML = `
      <article class="track">
        <h2>${track.name}</h2>
        <p>${track.note}</p>
        <p><a href="${track.source}" target="_blank" rel="noopener">Pixabay 来源页面</a></p>
        <div class="actions">
          <button class="play" type="button" data-play>试听</button>
          <button class="stop" type="button" data-stop>停止</button>
          <button class="choose" type="button" data-choose>我喜欢这首</button>
        </div>
      </article>
    `;

    document.addEventListener("click", (event) => {
      if (event.target.dataset.play !== undefined) playTrack();
      if (event.target.dataset.choose !== undefined) chooseTrack();
      if (event.target.dataset.stop !== undefined) {
        stopAll();
        document.getElementById("status").textContent = "已停止。";
      }
    });
  </script>
</body>
</html>
